<!DOCTYPE html>
<html>
<head>
<title>Werewords</title>
<style>
body{
    font-family: Arial;
    max-width:600px;
    margin:auto;
    padding:20px;
}
#messages{
    border:1px solid gray;
    height:200px;
    overflow:auto;
    padding:10px;
}
.online{
    color:green;
}
.offline{
    color:red;
}
</style>
</head>
<body>
<h1>🐺 Werewolf</h1>
<p id="version"></p>

<script>
  const now = new Date();
  document.getElementById("version").textContent =
    "Version: 1.0.0 | Loaded: " + now.toLocaleString();
</script>


<button onclick="testLogin()">
Login
</button>

<h3 id="userInfo"></h3>

<h3>Step 1: Create Username</h3>
<input id="username" placeholder="Username">
<button id="loginBtn">
Login
</button>





<h3>Step 2: Join or Create Lobby</h3>
<h4>Active Lobbies</h4>
<ul id="lobbies"></ul>
<h4>Create New Lobby</h4>
<input id="lobbyName"
placeholder="Lobby Name">
<button onclick="createGame()">
Create Lobby
</button>
<h3>Current Lobby:</h3>
<div id="currentLobbyStatus">Not in a lobby</div>
<button id="leaveLobbyBtn" onclick="leaveLobby()" style="display:none;">
Leave Current Lobby
</button>

<div id="hostSetup" style="display:none;">

<h3>Host Setup</h3>

<label>Number of Buildings</label>
<select id="buildingCount">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5" selected>5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
</select>

<br><br>

<!-- Initial Day Time removed from host controls -->
<label>Initial Night Time</label>
<select id="nightTime">
    <option value="1" selected>1 minute</option>
    <option value="3">3 minutes</option>
    <option value="5">5 minutes</option>
    <option value="10">10 minutes</option>
</select>
<br><br>
<label>Phase Advance Threshold (Percent)</label>
<select id="advanceThresholdValue" onchange="updateSettings()">
    <option value="25">25%</option>
    <option value="50" selected>50%</option>
    <option value="75">75%</option>
</select>
<div style="font-size:0.85em;color:#555;margin-top:6px;">
  Percent = % of living players. Count = exact number required.
</div>
<br><br>
<label>
  <input type="checkbox" id="hostCanBypass" checked>
  Allow host to force advance phases
</label>
<br><br>
</div>
<div id="gameStatus"></div>
<div id="phaseStatus"></div>
<div id="playerRole"></div>
<div id="gameControls" style="display:none;">
    <h3>Game Controls</h3>
    <div id="buildingChooser"></div>
    <div id="abilityControls"></div>
    <div id="gameActionStatus"></div>
    <div id="nominationControls"></div>
    <div id="voteControls"></div>
    <div id="readyControl"></div>
</div>
<button id="startGameBtn" onclick="startGame()">Start Game</button>




<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
